---
# ============================================================
# DESTINO EXCLUSIVO DO XOANSIEDADE.
# NUNCA usar $HOME/public_html/ — esse diretório é do iarevolution
# (domínio principal) e JAMAIS deve ser tocado por este deploy.
# ============================================================
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/xoansiedade.com/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -f index.html "$DEPLOYPATH"
    - /bin/cp -Rf assets "$DEPLOYPATH"
    - /bin/cp -f .htaccess "$DEPLOYPATH" 2>/dev/null || true
    - /bin/cp -f *.css "$DEPLOYPATH" 2>/dev/null || true
    - /bin/cp -f *.js "$DEPLOYPATH" 2>/dev/null || true
